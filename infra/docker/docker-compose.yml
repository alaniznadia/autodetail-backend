services:
  postgres:
    image: postgres:16-alpine
    container_name: autodetail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autodetail
      POSTGRES_USER: autodetail
      POSTGRES_PASSWORD: autodetail_dev
    ports:
      - "5432:5432"
    volumes:
      - autodetail_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autodetail -d autodetail"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: autodetail-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - autodetail_redis_data:/data
    command: redis-server --appendonly yes
volumes:
  autodetail_postgres_data:
  autodetail_redis_data:
